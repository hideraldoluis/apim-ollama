{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login">
  <img class="logo-login" src="/static/logo.svg" alt="" width="96" height="78">
  <h1>WAP Forge</h1>
  <p class="sub">Forjamos a IA. Entregamos o futuro.</p>
  {% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
  <form class="painel" method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_pre }}">
    <label>Usuário <input name="login" autocomplete="username" required autofocus></label>
    <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
