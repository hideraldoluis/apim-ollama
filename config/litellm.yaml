model_list:
  # model_name é o nome público que os clientes usam; model aponta para o Ollama.
  - model_name: llama3.2
    litellm_params:
      model: ollama_chat/llama3.2
      api_base: os.environ/OLLAMA_API_BASE

  # Exemplo para embeddings (baixe antes: scripts/pull-model.sh nomic-embed-text):
  # - model_name: nomic-embed-text
  #   litellm_params:
  #     model: ollama/nomic-embed-text
  #     api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  # Primeira requisição após inatividade inclui o tempo de carga do modelo.
  request_timeout: 600
  drop_params: true
  # Mantém o conteúdo das mensagens nos logs (necessário para gravar prompts no banco).
  turn_off_message_logging: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  max_request_size_mb: 5
  max_response_size_mb: 20
  # Grava prompt e resposta de cada requisição na tabela LiteLLM_SpendLogs, junto com a chave (hash) e o alias.
  store_prompts_in_spend_logs: true
  # Teto global de requisições simultâneas, alinhado a OLLAMA_NUM_PARALLEL. Excedentes recebem 429.
  global_max_parallel_requests: 8
