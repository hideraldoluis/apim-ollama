# Nenhum modelo fixo: todos são publicados pelo painel (tela Modelos) e gravados no banco
# (STORE_MODEL_IN_DB=True). Numa instalação nova, a API começa sem modelos disponíveis.
model_list: []

litellm_settings:
  # Primeira requisição após inatividade inclui o tempo de carga do modelo.
  request_timeout: 600
  drop_params: true
  # Mantém o conteúdo das mensagens nos logs (necessário para gravar prompts no banco).
  turn_off_message_logging: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  max_request_size_mb: 5
  max_response_size_mb: 20
  # Grava prompt e resposta de cada requisição na tabela LiteLLM_SpendLogs, junto com a chave (hash) e o alias.
  store_prompts_in_spend_logs: true
  # Retenção dos logs (inclui prompts e respostas): apaga registros com mais de 180 dias, verificando 1x por dia.
  # Os totais diários de consumo ficam no schema "painel" e não são apagados.
  maximum_spend_logs_retention_period: "180d"
  maximum_spend_logs_retention_interval: "1d"
  # Teto global de requisições simultâneas, alinhado a OLLAMA_NUM_PARALLEL. Excedentes recebem 429.
  global_max_parallel_requests: 8
